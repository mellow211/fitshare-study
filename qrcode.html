<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2. FitShare에 접속한다</title>
  <style>
    body {
      box-sizing: border-box;
      display: grid;
      height: 100svh;
      grid-template-rows: auto minmax(0, 1fr);
      margin: 0;
      padding: 16px;
      gap: 12px;
      place-items: center;
      background: #f5f5f5;
      font-family: sans-serif;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.5rem, min(6vw, 9svh), 4rem);
      line-height: 1.15;
      text-align: center;
    }
    img {
      display: block;
      width: auto;
      height: auto;
      max-width: min(100%, 640px);
      max-height: 100%;
      object-fit: contain;
      background: white;
    }
  </style>
</head>
<body>
  <h1>2. FitShare에 접속한다</h1>
  <img src="qrcode.jpeg" alt="QR 코드">
</body>
</html>
